# The whole stack: Postgres + FastAPI backend + React frontend behind nginx.
#   docker compose up -d --build     ->  http://localhost  (or the EC2 public IP)
# Only the frontend is published; the browser talks to one origin and nginx
# proxies /api to the backend over the internal network.
services:
  postgres:
    image: postgres:16
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # DEV ONLY, so `python run.py` on the host can reach this database.
      # Host port 55433 because 5432/5433 are taken by native Postgres services
      # on some dev machines. Comment this out in production, and never open
      # 5432/55433 in the EC2 security group.
      - "55433:5432"

  backend:
    build: ./backend
    container_name: ai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Inside the compose network Postgres is always postgres:5432. These win
      # over env_file, so backend/.env can keep host values for `python run.py`.
      DB_HOST: postgres
      DB_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    # Deliberately not published: reach the API through nginx on port 80.
    # (Publishing 8000 here also collides with a `python run.py` on the host.)
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: ai-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
