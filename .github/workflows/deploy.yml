name: Deploy to EC2

# Pushing to dev deploys. Run it by hand from the Actions tab too.
on:
  push:
    branches: [dev]
  workflow_dispatch:

# Never let two deploys build on the same box at once.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        # No AWS and no Postgres needed: S3, Textract and Bedrock are stubbed
        # by tests/conftest.py and the database is in-memory SQLite.
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'bash -s' < deploy/remote-deploy.sh

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
