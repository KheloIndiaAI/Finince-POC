name: Deploy to EC2

# Pushing to dev deploys. Run it by hand from the Actions tab too.
on:
  push:
    branches: [dev]
  workflow_dispatch:

# Never let two deploys build on the same box at once.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        # No AWS and no Postgres needed: S3, Textract and Bedrock are stubbed
        # by tests/conftest.py and the database is in-memory SQLite.
        run: python -m pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy secrets exist
        run: |
          missing=""
          [ -n "$EC2_HOST" ]    || missing="$missing EC2_HOST"
          [ -n "$EC2_USER" ]    || missing="$missing EC2_USER"
          [ -n "$EC2_SSH_KEY" ] || missing="$missing EC2_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions:"
            echo "  EC2_HOST     the Elastic IP, e.g. 3.109.163.45"
            echo "  EC2_USER     ubuntu"
            echo "  EC2_SSH_KEY  the whole .pem file, BEGIN/END lines included"
            exit 1
          fi
          echo "All three deploy secrets are set."

      - name: Add the deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts; then
            echo "::error::Cannot reach $EC2_HOST on port 22 from this runner."
            echo "GitHub runners have no fixed IP, so the EC2 security group must"
            echo "allow inbound 22 from 0.0.0.0/0 (or from GitHub's IP ranges)."
            exit 1
          fi

      - name: Pull and restart the stack
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=20 \
            "$EC2_USER@$EC2_HOST" 'bash -s' < deploy/remote-deploy.sh

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
