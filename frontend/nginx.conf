server {
    listen 80;
    server_name _;

    # The API accepts PDFs up to 20 MB and every request carries two of them.
    # nginx's default limit is 1 MB, which would reject real uploads with 413
    # before they ever reach the backend.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # An upload runs Textract OCR and a Bedrock call inline and can take a
        # couple of minutes on a scanned multi-page UC. The default 60s read
        # timeout would return 504 while extraction is still running.
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Single-page app: unknown paths must serve index.html, not 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
